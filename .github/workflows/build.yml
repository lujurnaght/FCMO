name: Build Fractional CMO

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Fonts (Archivo, Instrument Sans; SIL Open Font License)
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/fonts.sh
      - name: Build
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk FractionalCMO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FractionalCMO
          path: FractionalCMO.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fractional CMO v1.0.${{ github.run_number }}
          body: |
            **FractionalCMO.apk** – install this. Updates install over the old version and keep your progress.
            Built from ${{ github.sha }}.
          files: FractionalCMO.apk
          make_latest: true

  screens:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Fonts
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/fonts.sh
      - name: Screenshots
        run: gradle --no-daemon testDebugUnitTest --tests 'com.lujurnaght.fractionalcmo.ScreensTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          retention-days: 3
          path: app/build/screens/*.png
      - name: Keep the screenshots on the 'screens' branch (readable without artifact downloads)
        if: always()
        run: |
          set -e
          ls app/build/screens/*.png >/dev/null 2>&1 || exit 0
          mkdir /tmp/s && cp app/build/screens/*.png /tmp/s/ && cd /tmp/s
          git init -q -b screens && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "screens ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screens
